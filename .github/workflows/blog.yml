# Blog sayfalarını ve sitemap.xml'i Google E-Tablo'daki "Blog" sekmesinden üretir.
# Saatte bir kendiliğinden çalışır; GitHub'da Actions → "Blog sayfalarını güncelle" →
# "Run workflow" ile hemen de çalıştırılabilir.
name: Blog sayfalarını güncelle

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/build-blog.mjs", ".github/workflows/blog.yml"]

permissions:
  contents: write
  pages: write

concurrency:
  group: blog-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sayfaları üret
        run: node scripts/build-blog.mjs
      - name: Değişiklik varsa kaydet ve yayınla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A blog urun sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Blog sayfaları güncellendi"
          git push
          # Bot tarafından yapılan yüklemelerde site yayını kendiliğinden başlamayabilir; elle tetikle
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "Pages yayını tetiklenemedi (site yine de güncellenebilir)."
