<style>
:root{
  --font-serif:'Playfair Display',Georgia,serif; --font-sans:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  --bg:#FFFCF7; --bg2:#F8F2E9; --ink:#1E1B18; --ink2:#7A7166;
  --gold:#A6875D; --gold-d:#8A6D45; --line:#EFE7DA; --card:#FFFFFF;
  --danger:#B23A3A; --sale:#8C3A4B; --ok:#3A7A4E;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17140F; --bg2:#211D17; --ink:#F3ECE2; --ink2:#B8AE9F;
    --gold:#C7B08D; --gold-d:#A98F68; --line:#332C22; --card:#211D17; --sale:#C77C8E;
  }
}
:root[data-theme="dark"]{
  --bg:#17140F; --bg2:#211D17; --ink:#F3ECE2; --ink2:#B8AE9F;
  --gold:#C7B08D; --gold-d:#A98F68; --line:#332C22; --card:#211D17; --sale:#C77C8E;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--ink);}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
img{max-width:100%;display:block;}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:78px;}

/* Burcum Giyim Tarzı Kayan Yazı Duyuru Bandı */
.announcement-bar {
  background: var(--ink);
  color: var(--bg);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  padding: 7px 0;
  overflow: hidden;
  white-space: nowrap;
  position: relative;
  z-index: 25;
}
.announcement-track {
  display: inline-block;
  padding-left: 100%;
  animation: marquee 15s linear infinite;
}
@keyframes marquee {
  0% { transform: translate(0, 0); }
  100% { transform: translate(-100%, 0); }
}

.header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;display:flex;align-items:center;justify-content:space-between;}
.brand{font-family:var(--font-serif);font-size:21px;font-weight:600;letter-spacing:.3px;}
.brand small{display:block;font-size:10px;color:var(--ink2);font-weight:400;letter-spacing:1px;text-transform:uppercase;}
.icon-btn{position:relative;padding:6px;font-size:20px;}
.badge{position:absolute;top:0;right:0;background:var(--gold);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
.hero{margin:14px 16px;border-radius:16px;overflow:hidden;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.08);}
.hero img{width:100%;display:block;object-fit:cover;}
.btn{display:inline-block;background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:30px;font-size:13px;font-weight:600;letter-spacing:.3px;}
.section{padding:6px 16px 4px;}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.section-head h2{font-family:var(--font-serif);font-size:19px;font-weight:600;margin:0;padding-bottom:6px;border-bottom:2px solid var(--gold);display:inline-block;}
.section-head .link{font-size:12px;color:var(--gold-d);font-weight:600;}
.cats{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;-ms-overflow-style:none;scrollbar-width:none;}
.cats::-webkit-scrollbar{display:none;}
.cat-chip{flex:0 0 auto;padding:9px 16px;border-radius:20px;background:var(--bg2);font-size:13px;font-weight:600;border:1px solid var(--line);white-space:nowrap;}
.cat-chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative;}
.card .imgwrap{aspect-ratio:3/4;background:var(--bg2);position:relative;overflow:hidden;}
.card .imgwrap.cat-ph{display:flex;align-items:center;justify-content:center;}
.card .imgwrap.cat-ph span{font-family:var(--font-serif);font-size:44px;color:rgba(255,255,255,.9);}
.card .imgwrap img,.card .imgwrap video{width:100%;height:100%;object-fit:cover;filter:brightness(1.05) contrast(1.02);}
.play-badge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.play-badge span{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;}
.tag{position:absolute;top:8px;left:8px;background:var(--ink);color:var(--bg);font-size:10px;font-weight:700;padding:3px 8px;border-radius:10px;letter-spacing:.3px;}
.tag.sale{background:var(--sale);color:#fff;}
.fav{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.85);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;}
:root[data-theme="dark"] .fav,@media (prefers-color-scheme:dark){.fav{background:rgba(0,0,0,.5);}}
.card .info{padding:10px 10px 12px;}
.card .name{font-family:var(--font-serif);font-size:14px;font-weight:600;line-height:1.3;margin-bottom:4px;min-height:34px;}
.price-row{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}
.price{font-size:14px;font-weight:700;color:var(--gold-d);}
.old-price{font-size:11px;color:var(--ink2);text-decoration:line-through;}
.disc{font-size:10px;color:var(--sale);font-weight:700;}
.oos{position:absolute;inset:0;background:rgba(250,247,242,.7);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--ink2);}
:root[data-theme="dark"] .oos{background:rgba(23,20,15,.7);}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:var(--card);border-top:1px solid var(--line);display:flex;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:30;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--ink2);position:relative;padding:4px 0;}
.nav-item.active{color:var(--gold-d);}
.nav-item .ico{width:21px;height:21px;}
.nav-item .ico svg{width:100%;height:100%;display:block;}
.trust-row{display:flex;justify-content:space-around;padding:14px 16px 4px;gap:8px;}
.trust-item{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;text-align:center;}
.trust-item svg{width:24px;height:24px;color:var(--gold-d);}
.trust-item span{font-size:10.5px;color:var(--ink2);font-weight:600;line-height:1.25;}
.sk-card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;padding-bottom:10px;}
.sk-img{aspect-ratio:3/4;background:linear-gradient(90deg,var(--bg2) 25%,var(--line) 37%,var(--bg2) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;}
.sk-line{height:10px;margin:8px 10px 0;border-radius:5px;background:linear-gradient(90deg,var(--bg2) 25%,var(--line) 37%,var(--bg2) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:0 0}}
.view{padding:0 0 8px;}
.pd-gallery{aspect-ratio:4/5;background:var(--bg2);overflow:hidden;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-ms-overflow-style:none;scrollbar-width:none;}
.pd-gallery::-webkit-scrollbar{display:none;}
.pd-gallery-wrap{position:relative;}
.pd-dots{position:absolute;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:6px;pointer-events:none;}
.pd-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(0,0,0,.18);}
.pd-dot.active{background:#fff;}
.pd-gallery img,.pd-gallery video{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start;filter:brightness(1.05) contrast(1.02);}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;border-bottom:1px solid var(--line);}
.topbar h3{margin:0;font-size:15px;flex:1;}
.back{font-size:20px;}
.pd-body{padding:16px;}
.pd-name{font-family:var(--font-serif);font-size:21px;font-weight:600;margin:0 0 6px;}
.pd-price{font-size:20px;font-weight:700;color:var(--gold-d);}
.bulk-badge{display:inline-block;background:var(--bg2);color:var(--gold-d);border:1px solid var(--gold);font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;margin-top:8px;}
.stock-line{font-size:12px;margin:8px 0;font-weight:600;}
.stock-line.in{color:var(--ok);}
.stock-line.out{color:var(--danger);}
.opt-label{font-size:13px;font-weight:700;margin:16px 0 8px;}
.opt-row{display:flex;gap:8px;flex-wrap:wrap;}
.opt-pill{padding:9px 15px;border-radius:10px;border:1.5px solid var(--line);font-size:13px;font-weight:600;background:var(--card);}
.opt-pill.selected{border-color:var(--gold);background:var(--bg2);color:var(--gold-d);}
.opt-pill.disabled{opacity:.35;text-decoration:line-through;}
.qty-row{display:flex;align-items:center;gap:14px;margin-top:6px;}
.qty-btn{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;font-size:17px;display:flex;align-items:center;justify-content:center;}
.qty-val{font-size:15px;font-weight:700;min-width:20px;text-align:center;}
.desc-block{margin-top:20px;font-size:13px;line-height:1.7;color:var(--ink2);}
.desc-block h4{color:var(--ink);font-size:13px;margin:14px 0 4px;}
.sticky-cta{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;}
.btn-main{flex:1;background:var(--ink);color:var(--bg);padding:14px;border-radius:12px;font-weight:700;font-size:14px;text-align:center;}
.btn-wa{background:#25D366;color:#fff;padding:14px;border-radius:12px;width:52px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.btn-wa svg{width:26px;height:26px;fill:#fff;}
.lightbox{position:fixed;inset:0;background:rgba(10,8,6,.92);z-index:100;display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);}
.lightbox img,.lightbox video{max-width:100%;max-height:100%;object-fit:contain;}
.lightbox-close{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;}
.lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;}
.lightbox-nav.prev{left:12px;} .lightbox-nav.next{right:12px;}
.pd-gallery img{cursor:zoom-in;}
.cart-item{display:flex;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);}
.cart-item img{width:70px;height:88px;object-fit:cover;border-radius:8px;background:var(--bg2);}
.ci-info{flex:1;}
.ci-name{font-size:13px;font-weight:600;margin-bottom:2px;}
.ci-var{font-size:11px;color:var(--ink2);margin-bottom:6px;}
.ci-controls{display:flex;align-items:center;justify-content:space-between;}
.ci-qty{display:flex;align-items:center;gap:8px;}
.mini-btn{width:26px;height:26px;border:1px solid var(--line);border-radius:6px;font-size:14px;}
.remove{font-size:11px;color:var(--danger);font-weight:600;}
.summary-box{padding:16px;background:var(--bg2);margin:10px 16px;border-radius:14px;}
.sum-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;color:var(--ink2);}
.sum-row.total{font-size:16px;font-weight:700;color:var(--ink);border-top:1px solid var(--line);padding-top:10px;margin-top:2px;}
.free{color:var(--ok);font-weight:700;}
.empty-state{text-align:center;padding:60px 24px;color:var(--ink2);}
.empty-state .ico{font-size:44px;margin-bottom:12px;}
.form-group{padding:0 16px;margin-bottom:14px;}
.form-group label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;color:var(--ink2);}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:14px;font-family:inherit;}
.form-group .err{color:var(--danger);font-size:11px;margin-top:4px;}
.row2{display:flex;gap:10px;padding:0 16px;}
.row2 .form-group{flex:1;padding:0;}
.check-row{display:flex;gap:10px;align-items:flex-start;padding:0 16px;margin:14px 0;font-size:12px;color:var(--ink2);}
.check-row input{margin-top:2px;}
.pay-opt{margin:0 16px;padding:14px;border:1.5px solid var(--gold);background:var(--bg2);border-radius:12px;font-size:13px;}
.pay-opt b{display:block;margin-bottom:4px;}
.success-wrap{text-align:center;padding:50px 24px 20px;}
.success-wrap .tick{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;font-size:32px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
.order-no{font-size:13px;color:var(--ink2);margin-top:4px;}
.order-no b{color:var(--ink);font-family:monospace;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:30px;font-size:13px;font-weight:600;opacity:0;transition:.25s;z-index:50;display:flex;gap:10px;align-items:center;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast a{color:var(--gold);text-decoration:underline;}
.search-box{padding:10px 16px;position:sticky;top:0;background:var(--bg);z-index:20;}
.search-box input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);font-size:14px;color:var(--ink);}
.filter-bar{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;}
.sort-chip{padding:7px 12px;border-radius:16px;background:var(--bg2);font-size:12px;font-weight:600;border:1px solid var(--line);white-space:nowrap;}
.sort-chip.active{background:var(--ink);color:var(--bg);}
.acc-item{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid var(--line);font-size:14px;font-weight:600;}
.social{display:flex;gap:10px;padding:20px 16px 30px;justify-content:center;}
.social a{font-size:13px;font-weight:600;padding:10px 16px;border-radius:10px;background:var(--bg2);}
.desk-header,.pd-cta-desk{display:none;}
@media (min-width:900px){
 body{font-size:15px;}
 #app{max-width:1240px;padding-bottom:0;}
 .bottom-nav{display:none;}
 .header{display:none;}
 .announcement-bar{font-size:12px;padding:9px 0;}
 .desk-header{display:block;position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);}
 .desk-header-in{display:flex;align-items:center;gap:28px;padding:14px 32px;}
 .desk-brand{text-align:left;padding:0;flex:0 0 auto;}
 .desk-brand .brand{font-size:24px;}
 .desk-nav{display:flex;gap:4px;flex:1;flex-wrap:wrap;}
 .dn-link{padding:9px 15px;border-radius:20px;font-size:14px;font-weight:600;color:var(--ink2);transition:background .15s,color .15s;}
 .dn-link:hover{background:var(--bg2);color:var(--ink);}
 .dn-link.active{background:var(--ink);color:var(--bg);}
 .desk-actions{display:flex;gap:2px;align-items:center;flex:0 0 auto;}
 .da-btn{position:relative;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);transition:background .15s;}
 .da-btn:hover{background:var(--bg2);}
 .da-btn svg{width:23px;height:23px;}
 .da-btn .badge{top:3px;right:1px;}
 .topbar{position:static;padding:16px 32px 4px;border-bottom:none;}
 .topbar h3{font-size:13px;font-weight:500;color:var(--ink2);}
 .back{font-size:26px;line-height:1;padding:0 6px;}
 .hero{margin:22px 32px 10px;border-radius:20px;}
 .trust-row{display:none;}
 .section{padding:14px 32px 8px;}
 .section:has(> .cats){display:none;}
 .section-head{margin-bottom:16px;}
 .section-head h2{font-size:26px;}
 .section-head .link{font-size:14px;}
 .grid{grid-template-columns:repeat(3,1fr);gap:22px;}
}
@media (min-width:1100px){
 .grid{grid-template-columns:repeat(4,1fr);}
}
@media (min-width:900px) and (max-width:1099px){
 .desk-header-in{gap:14px;padding:12px 20px;}
 .desk-brand .brand{font-size:20px;}
 .dn-link{padding:8px 10px;font-size:13px;}
 .da-btn{width:38px;height:38px;}
 .hero{margin-left:20px;margin-right:20px;}
 .section{padding-left:20px;padding-right:20px;}
}
@media (min-width:900px){
 .card{transition:box-shadow .2s,transform .2s;cursor:pointer;}
 .card:hover{box-shadow:0 12px 30px rgba(0,0,0,.10);transform:translateY(-3px);}
 .card .info{padding:14px 14px 16px;}
 .card .name{font-size:16px;min-height:42px;}
 .price{font-size:16px;}
 .old-price{font-size:13px;}
 .tag{font-size:11px;padding:4px 10px;}
 .filter-bar{padding:12px 32px;flex-wrap:wrap;}
 .sort-chip{font-size:13px;padding:8px 14px;cursor:pointer;}
 .search-box{position:static;padding:14px 32px;max-width:680px;}
 .social{padding:36px 32px 56px;}
 .view{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:52px;padding:16px 32px 48px;align-items:start;max-width:1180px;margin:0 auto;}
 .pd-gallery{display:block;aspect-ratio:auto;overflow:visible;background:none;}
 .pd-gallery img,.pd-gallery video{display:block;width:100%;height:auto;aspect-ratio:4/5;border-radius:16px;margin-bottom:14px;object-fit:cover;}
 .pd-dots{display:none;}
 .pd-body{padding:4px 0 0;}
 .pd-name{font-size:30px;line-height:1.2;}
 .pd-price{font-size:26px;}
 .opt-label{font-size:14px;}
 .opt-pill{font-size:14px;padding:10px 18px;transition:border-color .15s;}
 .opt-pill:hover{border-color:var(--gold);}
 .desc-block{font-size:14px;}
 .sticky-cta{display:none;}
 .pd-cta-desk{display:flex;gap:10px;margin-top:24px;}
 .pd-cta-desk .btn-main{flex:1;padding:16px;font-size:15px;}
 .pd-cta-desk .btn-main:hover{opacity:.88;}
 .page-narrow{max-width:640px;margin:0 auto;padding-bottom:30px;}
 .toast{bottom:32px;}
}
</style>
</head>

<div id="app"></div>
<script>
(function(){

function parseCSV(text){
 var rows=[],row=[],field="",inQ=false;
 for(var i=0;i<text.length;i++){var c=text[i];
  if(inQ){ if(c=='"'){ if(text[i+1]=='"'){field+='"';i++;} else inQ=false; } else field+=c; }
  else { if(c=='"') inQ=true; else if(c==','){row.push(field);field="";}
   else if(c=='\n'||c=='\r'){ if(c=='\r'&&text[i+1]=='\n') i++; row.push(field);field="";rows.push(row);row=[]; }
   else field+=c; }
 }
 if(field.length||row.length){row.push(field);rows.push(row);}
 return rows.filter(function(r){return r.length>1||r[0];});
}

function csvToObjects(text){
 var rows=parseCSV(text); if(!rows.length) return [];
 var headers=rows[0].map(function(h){return h.trim().replace(/^"|"$/g, '');});
 return rows.slice(1).filter(function(r){return r.some(function(v){return v&&v.trim();});}).map(function(r){
  var o={}; headers.forEach(function(h,i){o[h]=(r[i]||"").trim().replace(/^"|"$/g, '');}); return o;
 });
}

// "Siyah=url1|url2;Beyaz=url3" biçimini {Siyah:[url1,url2], Beyaz:[url3]} haline getirir
function parseColorImages(str){
 var out={};
 if(!str) return out;
 String(str).split(";").forEach(function(part){
  var i=part.indexOf("="); if(i<1) return;
  var color=part.slice(0,i).trim();
  var urls=part.slice(i+1).split("|").map(function(u){return u.trim();}).filter(Boolean).slice(0,5);
  if(color && urls.length) out[color]=urls;
 });
 return out;
}
function hasText(v){ v=String(v==null?"":v).trim(); return v!=="" && v!=="—"; }
function splitList(s){ return s? s.split("|").map(function(x){return x.trim();}).filter(Boolean) : []; }

function loadProductsFromSheet(){

  var fresh=prodRows.filter(function(p){return p.id;}).map(function(p){
   var colors=splitList(p.colors); if(!colors.length) colors=["Standart"];
   var sizes=splitList(p.sizes); if(!sizes.length) sizes=["Standart"];
   
   var variants=[];
   colors.forEach(function(c){
    sizes.forEach(function(sz){
     variants.push({color:c, size:sz, stock:10});
    });
   });

   return {

    shortDescription:p.shortDescription||"", description:p.description||"",
    fabric:p.fabric||"", fit:p.fit||"", measurements:p.measurements||"", modelInfo:p.modelInfo||"",
    images:splitList(p.images).length?splitList(p.images):[IMG(p.id)],
    colors:colors, colors2:splitList(p.colors2), color1Label:p.color1Label||"", color2Label:p.color2Label||"", sizes:sizes, variants:variants,
    sira: (parseInt(p.sira,10)||9999),
    colorImagesMap: parseColorImages(p.colorImages)
   };
  });

 }).catch(function(e){ console.warn("Sheet verisi okunamadı.",e); return false; });
}

function isVideo(url){ return /\.(mp4|webm|mov)(\?|$)/i.test(url||""); }
function mediaTag(url,opts){
 opts=opts||{};
 if(isVideo(url)){
  return '<video src="'+url+'" preload="'+(opts.autoplay?'auto':'metadata')+'" playsinline muted loop'+(opts.controls?' controls':'')+(opts.autoplay?' autoplay':'')+(opts.attrs||'')+'></video>';
 }
 return '<img src="'+url+'" loading="lazy" alt=""'+(opts.attrs||'')+'>';
}
function parsePrice(str){
 if(str==null) return 0;
 var s=String(str).trim().replace(/[^0-9.,\-]/g,"");
 if(!s) return 0;
 if(s.indexOf(",")>-1 && s.indexOf(".")>-1){
  if(s.lastIndexOf(",")>s.lastIndexOf(".")){ s=s.replace(/\./g,"").replace(",","."); }
  else { s=s.replace(/,/g,""); }
 } else if(s.indexOf(",")>-1){
  var parts=s.split(",");
  if(parts[parts.length-1].length<=2){ s=parts.slice(0,-1).join("")+"."+parts[parts.length-1]; }
  else { s=s.replace(/,/g,""); }
 }
 var n=parseFloat(s);
 return isNaN(n)?0:n;
}
function findProduct(id){ for(var i=0;i<PRODUCTS.length;i++){ if(PRODUCTS[i].id===id) return PRODUCTS[i]; } return null; }
function findVariant(p,color,size){ for(var i=0;i<p.variants.length;i++){ var v=p.variants[i]; if(v.color===color&&v.size===size) return v; } return null; }
function productBaseName(p){
 var name=p.name, colors=p.colors.slice().sort(function(a,b){return b.length-a.length;});
 for(var i=0;i<colors.length;i++){
  var c=colors[i];
  if(name.toLowerCase().slice(-c.length)===c.toLowerCase()){ return name.slice(0,name.length-c.length).trim(); }
 }
 return name;
}
function productDisplayName(p,color,color2){
 var base=productBaseName(p);
 if(color2){
  var l1=(p&&p.color1Label)||"Sweat", l2=(p&&p.color2Label)||"Pantolon";
  return base+" ("+color+" "+l1+" / "+color2+" "+l2+")";
 }
 return color? (base+" "+color) : base;
}
function colorImages(p,color){
 var m=p.colorImagesMap;
 if(m && color && m[color] && m[color].length){ return m[color]; }
 if(p.images.length===p.colors.length){ var idx=p.colors.indexOf(color); if(idx>-1) return [p.images[idx]]; }
 return p.images;
}
function money(n){ return n.toLocaleString("tr-TR")+" TL"; }
function cartCount(){ var c=0; state.cart.forEach(function(i){c+=i.qty;}); return c; }
function lineTotal(item){
 var p=findProduct(item.productId);
 if(p && p.bulkPrice2){
  var pairs=Math.floor(item.qty/2), rem=item.qty%2;
  return pairs*p.bulkPrice2 + rem*item.price;
 }
 return item.price*item.qty;
}
function cartSubtotal(){ var s=0; state.cart.forEach(function(i){s+=lineTotal(i);}); return s; }
function isFav(id){ return state.favorites.indexOf(id)>-1; }

function go(view,opts){ opts=opts||{}; state.view=view; state.productId=opts.productId||null; state.category=opts.category||null;
 if(view==="product"){ state.pdColor=opts.color||null; state.pdColor2=null; state.pdSize=null; state.pdQty=1; }

function syncUrl(pushHistory){
 var url = new URL(window.location.href);
 url.search = "";
 if(state.view==="product" && state.productId){ url.searchParams.set("urun", state.productId); }
 else if(state.view==="category" && state.category){ url.searchParams.set("kategori", state.category); }
 var newUrl = url.pathname + url.search;
 var histState = {view:state.view, productId:state.productId, category:state.category};
 if(pushHistory){ history.pushState(histState, "", newUrl); } else { history.replaceState(histState, "", newUrl); }
 var p = state.view==="product" ? findProduct(state.productId) : null;
 document.title = p ? (productDisplayName(p, state.pdColor||p.colors[0]) + " — Gülsüm Aydın Butik") : "Gülsüm Aydın Butik — Tesettür Giyim";
}
function openFromUrl(){
 var params = new URLSearchParams(window.location.search);
 var urunId = params.get("urun");
 var kategori = params.get("kategori");
 if(urunId && findProduct(urunId)){ go("product",{productId:urunId}); }
 else if(kategori){ go("category",{category:kategori}); }
}
window.addEventListener("popstate", function(e){
 _fromPopstate=true;
 var st=e.state;
 if(st){ state.view=st.view||"home"; state.productId=st.productId||null; state.category=st.category||null; }
 else {
  var params=new URLSearchParams(window.location.search);
  var urunId=params.get("urun"), kategori=params.get("kategori");
  if(urunId && findProduct(urunId)){ state.view="product"; state.productId=urunId; }
  else if(kategori){ state.view="category"; state.category=kategori; }
  else { state.view="home"; state.productId=null; state.category=null; }
 }
 window.scrollTo(0,0); render();
 _fromPopstate=false;
});

function showToast(msg,link){
 var t=document.getElementById("toast");
 t.innerHTML = esc(msg) + (link? ' <a href="#" data-goto="cart">Sepete Git</a>':"");
 t.classList.add("show");
 clearTimeout(window._toastTimer);
 window._toastTimer=setTimeout(function(){ t.classList.remove("show"); }, 2600);
}

function addToCart(p,color,size,qty,color2){
 var variant=findVariant(p,color,size);
 if(!variant||variant.stock<1){ showToast("Bu varyant stokta yok"); return; }
 var key=p.id+"-"+color+"-"+(color2||"")+"-"+size;
 var existing=null;
 state.cart.forEach(function(i){ if(i.key===key) existing=i; });
 var currentQty = existing? existing.qty:0;
 if(currentQty+qty>variant.stock){ showToast("Stokta sadece "+variant.stock+" adet var"); return; }
 if(existing){ existing.qty+=qty; } else {
  state.cart.push({key:key,productId:p.id,name:productDisplayName(p,color,color2),image:colorImages(p,color)[0],color:color,color2:color2||null,size:size,price:p.price,qty:qty});
 }
 saveLS("ga_cart",state.cart);
 showToast("Ürün sepete eklendi",true);
 render();
}

function changeQty(key,delta){
 var item=null; state.cart.forEach(function(i){ if(i.key===key) item=i; });
 if(!item) return;
 var p=findProduct(item.productId); var v=p?findVariant(p,item.color,item.size):null;
 var maxStock = v? v.stock : 99;
 item.qty+=delta;
 if(item.qty<1){ state.cart=state.cart.filter(function(i){return i.key!==key;}); }
 else if(item.qty>maxStock){ item.qty=maxStock; showToast("Stok sınırına ulaşıldı"); }
 saveLS("ga_cart",state.cart); render();
}

function removeItem(key){ state.cart=state.cart.filter(function(i){return i.key!==key;}); saveLS("ga_cart",state.cart); render(); }

function productCard(p,variantColor){
 var disc = p.oldPrice? Math.round((1-p.price/p.oldPrice)*100):0;
 var totalStock = p.variants.reduce(function(a,v){return a+v.stock;},0);
 var dispName = variantColor? productDisplayName(p,variantColor) : p.name;
 var img = variantColor? colorImages(p,variantColor)[0] : p.images[0];
 return '<div class="card" data-goto="product" data-id="'+p.id+'"'+(variantColor?' data-color="'+esc(variantColor)+'"':'')+'>'+
  '<div class="imgwrap">'+mediaTag(img)+(isVideo(img)?'<div class="play-badge"><span>▶</span></div>':'')+
  (p.isNew?'<span class="tag">Yeni</span>':(p.isBestSeller?'<span class="tag">Çok Satan</span>':''))+
  (disc>0?'<span class="tag sale" style="top:auto;bottom:8px;left:8px;">%'+disc+'</span>':'')+
  '<button class="fav" data-fav="'+p.id+'">'+(isFav(p.id)?'❤️':'🤍')+'</button>'+
  (totalStock===0?'<div class="oos">Tükendi</div>':'')+
  '</div><div class="info"><div class="name">'+esc(dispName)+'</div>'+
  '<div class="price-row"><span class="price">'+money(p.price)+'</span>'+
  (p.oldPrice?'<span class="old-price">'+money(p.oldPrice)+'</span>':'')+'</div></div></div>';
}
function expandVariants(list){
 var out=[];
 list.forEach(function(p){
  var noC2 = (!p.colors2||!p.colors2.length);
  var m = p.colorImagesMap || {};
  var photoColors = p.colors.filter(function(c){ return m[c] && m[c].length; });
  if(noC2 && photoColors.length>1){
   photoColors.forEach(function(c){ out.push({product:p, color:c}); });
  } else if(noC2 && !photoColors.length && p.images.length===p.colors.length && p.colors.length>1){
   p.colors.forEach(function(c){ out.push({product:p, color:c}); });
  } else {
   out.push({product:p, color:null});
  }
 });
 return out;
}
function renderCards(list){
 return expandVariants(list).map(function(e){ return productCard(e.product, e.color); }).join('');
}

 return '<div class="lightbox" data-lightbox-bg="1">'+
  '<button class="lightbox-close" data-lightbox-close="1">✕</button>'+
  (imgs.length>1? '<button class="lightbox-nav prev" data-lightbox-nav="prev">‹</button>':'')+
  mediaTag(imgs[i],{controls:true,autoplay:isVideo(imgs[i])})+
  (imgs.length>1? '<button class="lightbox-nav next" data-lightbox-nav="next">›</button>':'')+
 '</div>';
}

document.addEventListener("scroll", function(e){
 var g=e.target;
 if(g && g.classList && g.classList.contains("pd-gallery") && g.parentNode){
  var i=Math.round(g.scrollLeft/(g.clientWidth||1));
  var dots=g.parentNode.querySelectorAll(".pd-dot");
  for(var k=0;k<dots.length;k++){ dots[k].classList.toggle("active", k===i); }
 }
}, true);
document.addEventListener("click", function(e){
 var lb = e.target.closest("[data-lightbox]");
 if(lb){ state.lightboxIndex=parseInt(lb.getAttribute("data-lightbox"),10); state.lightboxOpen=true; render(); return; }
 var lbClose = e.target.closest("[data-lightbox-close]");
 var lbBg = e.target.closest("[data-lightbox-bg]");
 if(lbClose || (lbBg && e.target===lbBg)){ state.lightboxOpen=false; render(); return; }
 var lbNav = e.target.closest("[data-lightbox-nav]");
 if(lbNav){
  var dir=lbNav.getAttribute("data-lightbox-nav"); var len=state.currentGallery.length;
  state.lightboxIndex = dir==="next" ? (state.lightboxIndex+1)%len : (state.lightboxIndex-1+len)%len;
  render(); return;
 }
 var t = e.target.closest("[data-goto]");
 if(t){
  var v = t.getAttribute("data-goto");
  var card = t.closest("[data-id]");
  if(v==="product"){ var _el=(card||t); go("product",{productId:_el.getAttribute("data-id"), color:_el.getAttribute("data-color")}); }
  else { go(v); }
  return;
 }
 var catBtn = e.target.closest("[data-cat]");
 if(catBtn){ go("category",{category:catBtn.getAttribute("data-cat")}); return; }
 var cardEl = e.target.closest(".card[data-id]");
 if(cardEl && !e.target.closest("[data-fav]")){ go("product",{productId:cardEl.getAttribute("data-id"), color:cardEl.getAttribute("data-color")}); return; }
 var favBtn = e.target.closest("[data-fav]");
 if(favBtn){ e.stopPropagation(); toggleFav(favBtn.getAttribute("data-fav")); return; }
 var sortBtn = e.target.closest("[data-sort]");
 if(sortBtn){ state.sort=sortBtn.getAttribute("data-sort"); render(); return; }
 var colorBtn = e.target.closest("[data-color]");
 if(colorBtn){ state.pdColor=colorBtn.getAttribute("data-color"); render(); return; }
 var color2Btn = e.target.closest("[data-color2]");
 if(color2Btn){ state.pdColor2=color2Btn.getAttribute("data-color2"); render(); return; }
 var sizeBtn = e.target.closest("[data-size]");
 if(sizeBtn){ state.pdSize=sizeBtn.getAttribute("data-size"); render(); return; }
 var qtyBtn = e.target.closest("[data-qty]");
 if(qtyBtn){ var d=parseInt(qtyBtn.getAttribute("data-qty"),10); state.pdQty=Math.max(1,state.pdQty+d); render(); return; }
 var addBtn = e.target.closest('[data-action="addcart"]');
 if(addBtn){
  var p=findProduct(state.productId);
  if(p){ addToCart(p, state.pdColor||p.colors[0], state.pdSize||p.sizes[0], state.pdQty, (p.colors2&&p.colors2.length)?(state.pdColor2||p.colors2[0]):null); }
  return;
 }
 var cqtyBtn = e.target.closest("[data-cqty]");
 if(cqtyBtn){ var parts=cqtyBtn.getAttribute("data-cqty").split("|"); changeQty(parts[0],parseInt(parts[1],10)); return; }
 var rmBtn = e.target.closest("[data-remove]");
 if(rmBtn){ removeItem(rmBtn.getAttribute("data-remove")); return; }
});

document.addEventListener("input", function(e){
 if(e.target.id==="searchInput"){ state.searchQ=e.target.value; renderSearchResultsOnly(); }
});
function renderSearchResultsOnly(){
 var scrollY=window.scrollY;
 render();
 var si=document.getElementById("searchInput");
 if(si){ si.focus(); si.setSelectionRange(si.value.length,si.value.length); }
 window.scrollTo(0,scrollY);
}

document.addEventListener("submit", function(e){
 if(e.target.id!=="checkoutForm") return;
 e.preventDefault();
 var fd=new FormData(e.target);
 var f={};
 fd.forEach(function(v,k){ f[k]=v; });
 f.agree = document.getElementById("agree").checked;
 var errors={};
 if(!f.firstName) errors.firstName="Ad zorunludur.";
 if(!f.lastName) errors.lastName="Soyad zorunludur.";
 if(!f.phone || !/^0?5\d{2}\s?\d{3}\s?\d{2}\s?\d{2}$/.test(f.phone.replace(/\s/g,'').replace(/^0?5/,'05'))){
  if(!/^0?5[0-9]{9}$/.test(f.phone.replace(/\s/g))) errors.phone="Geçerli bir telefon numarası girin (05XX XXX XX XX).";
 }
 if(!f.city || f.city==="Seçiniz") errors.city="İl seçiniz.";
 if(!f.district) errors.district="İlçe zorunludur.";
 if(!f.neighborhood) errors.neighborhood="Mahalle zorunludur.";
 if(!f.address) errors.address="Açık adres zorunludur.";
 if(!f.agree) errors.agree="Devam etmek için sözleşmeyi onaylayın.";
 state.checkoutForm=f; saveLS("ga_checkout_draft",f);
 state.formErrors=errors;
 if(Object.keys(errors).length){ render(); return; }
 var order={
  orderId:genOrderId(), createdAt:new Date().toISOString(),
  customerName:f.firstName+" "+f.lastName, customerPhone:f.phone, customerEmail:f.email||"",
  city:f.city, district:f.district, neighborhood:f.neighborhood, address:f.address, note:f.note||"",
  items:state.cart.slice(), subtotal:cartSubtotal(), shipping:SHIPPING_FEE, total:cartSubtotal()+SHIPPING_FEE,
  paymentMethod:"Kapıda Ödeme", status:"Yeni Sipariş"
 };
 state.lastOrder=order; saveLS("ga_last_order",order);
 sendOrderToSheet(order);
 state.cart=[]; saveLS("ga_cart",[]);
 state.checkoutForm={}; saveLS("ga_checkout_draft",{});
 state.formErrors={};
 go("success");
});

function applySettings(){
 if(SETTINGS.metaTitle){ document.title = SETTINGS.metaTitle; }
 if(SETTINGS.metaDescription){
  var m = document.querySelector('meta[name="description"]');
  if(m) m.setAttribute("content", SETTINGS.metaDescription);
 }
 if(SETTINGS.gaId && !window._gaLoaded){
  window._gaLoaded = true;
  var s1 = document.createElement("script");
  s1.async = true;
  s1.src = "https://www.googletagmanager.com/gtag/js?id=" + SETTINGS.gaId;
  document.head.appendChild(s1);
  window.dataLayer = window.dataLayer || [];
  function gtag(){ window.dataLayer.push(arguments); }
  gtag("js", new Date());
  gtag("config", SETTINGS.gaId);
 }
}

render();
loadSettingsFromSheet().then(function(updated){ if(updated){ applySettings(); render(); } });
loadProductsFromSheet().then(function(updated){ if(updated) render(); _fromPopstate=true; openFromUrl(); _fromPopstate=false; });
})();
</script>
