<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, follow">
<title>Sipariş Takip | Gülsüm Aydın Butik</title>
<link rel="canonical" href="https://www.gulsumaydin.com.tr/siparis-takip/">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--font-serif:'Playfair Display',Georgia,serif;--font-sans:'Inter','Segoe UI',system-ui,sans-serif;--bg:#FFFCF7;--bg2:#F8F2E9;--ink:#1E1B18;--ink2:#7A7166;--gold:#A6875D;--gold-d:#8A6D45;--line:#EFE7DA;--card:#fff;--danger:#B23A3A;--ok:#3A7A4E;}
@media (prefers-color-scheme:dark){:root{--bg:#17140F;--bg2:#211D17;--ink:#F3ECE2;--ink2:#B8AE9F;--gold:#C7B08D;--gold-d:#C7B08D;--line:#332C22;--card:#211D17;--danger:#E27D7D;--ok:#7CC593;}}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.top{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.top a{color:inherit;text-decoration:none}.brand{font-family:var(--font-serif);font-size:20px;font-weight:700}
.back{font-size:13px;color:var(--ink2)}
main{max-width:520px;margin:0 auto;padding:28px 18px 60px}
h1{font-family:var(--font-serif);font-size:27px;margin:0 0 6px;letter-spacing:-.2px}
.lead{color:var(--ink2);font-size:14px;line-height:1.6;margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
label{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit;background:var(--bg);color:var(--ink);margin-bottom:16px}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hint{font-size:12px;color:var(--ink2);margin:-10px 0 16px}
button.go{width:100%;background:var(--ink);color:var(--bg);border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
button.go[disabled]{opacity:.6;cursor:wait}
.err{background:rgba(178,58,58,.1);color:var(--danger);border-radius:10px;padding:12px 14px;font-size:13.5px;margin-top:14px}
#res{margin-top:22px}
.ono{font-size:12px;color:var(--ink2)}.ono b{display:block;font-family:var(--font-serif);font-size:19px;color:var(--ink);margin-top:2px}
.steps{list-style:none;margin:20px 0 4px;padding:0}
.steps li{display:flex;gap:14px;position:relative;padding-bottom:20px;font-size:14px;color:var(--ink2)}
.steps li:last-child{padding-bottom:0}
.steps li::before{content:"";position:absolute;left:10px;top:22px;bottom:2px;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--card);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff}
.steps li.done{color:var(--ink)}.steps li.done .dot{background:var(--ok);border-color:var(--ok)}
.steps li.done::before{background:var(--ok)}
.steps li.now{color:var(--ink);font-weight:600}.steps li.now .dot{border-color:var(--gold);background:var(--gold)}
.steps small{display:block;font-weight:400;color:var(--ink2);font-size:12.5px;margin-top:2px}
.cancel{background:rgba(178,58,58,.1);color:var(--danger);border-radius:10px;padding:12px 14px;font-size:14px;margin:16px 0 4px}
.box{background:var(--bg2);border-radius:10px;padding:14px 16px;margin-top:16px;font-size:13.5px;line-height:1.6}
.box .k{font-size:12px;color:var(--ink2)}
.cta{display:block;text-align:center;background:var(--ink);color:var(--bg);text-decoration:none;border-radius:10px;padding:13px;font-weight:600;font-size:14.5px;margin-top:14px}
.wa{display:block;text-align:center;border:1px solid var(--line);color:var(--ink);text-decoration:none;border-radius:10px;padding:12px;font-weight:600;font-size:14px;margin-top:10px}
.foot{margin-top:26px;font-size:12.5px;color:var(--ink2);text-align:center;line-height:1.7}.foot a{color:var(--gold-d)}
</style>
</head>
<body>
<div class="top"><a class="brand" href="/">Gülsüm Aydın</a><a class="back" href="/">Alışverişe dön</a></div>
<main>
 <h1>Sipariş takip</h1>
 <p class="lead">Sipariş numaranızı ve siparişte kullandığınız telefonun son 4 hanesini yazın, siparişinizin nerede olduğunu görün.</p>
 <form class="card" id="f" autocomplete="off">
  <label for="no">Sipariş numarası</label>
  <input id="no" name="no" placeholder="GA-20261015-001" autocapitalize="characters" required>
  <label for="tel">Telefonunuzun son 4 hanesi</label>
  <input id="tel" name="tel" inputmode="numeric" maxlength="4" placeholder="1234" required>
  <button class="go" id="btn" type="submit">Siparişimi göster</button>
  <div id="err" class="err" hidden></div>
 </form>
 <div id="res"></div>
 <div class="foot">Sorunuz mu var? <a href="https://wa.me/908508406128" rel="noopener">WhatsApp'tan yazın</a><br>Sipariş numaranız, sipariş sonrası ekranda ve e-postanızda yer alır.</div>
</main>
<script>
var ENDPOINT="https://script.google.com/macros/s/AKfycbxIN5wq17o0GKbpcmpvxd1dPCrvFIj3kp0nYKXHBWhEsdl4wpLxZoY6xUVdPSybPl7S/exec";
var STEPS=[["Yeni Sipariş","Siparişiniz alındı","Siparişiniz bize ulaştı, kısa süre içinde teyit için sizinle iletişime geçeceğiz."],
 ["Onaylandı","Siparişiniz onaylandı","Siparişiniz teyit edildi."],
 ["Hazırlanıyor","Hazırlanıyor","Ürünleriniz özenle paketleniyor."],
 ["Kargoya Verildi","Kargoya verildi","PTT Kargo ile yola çıktı."],
 ["Teslim Edildi","Teslim edildi","Siparişiniz size ulaştı. İyi günlerde kullanın."]];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function money(n){return Math.round(n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,".")+" TL";}
var f=document.getElementById("f"),btn=document.getElementById("btn"),err=document.getElementById("err"),res=document.getElementById("res");
var q=new URLSearchParams(location.search); if(q.get("no")) document.getElementById("no").value=q.get("no");
f.addEventListener("submit",function(e){
 e.preventDefault(); err.hidden=true; res.innerHTML="";
 var no=document.getElementById("no").value.trim().toUpperCase(), tel=document.getElementById("tel").value.replace(/\D/g,"");
 btn.disabled=true; btn.textContent="Sorgulanıyor...";
 fetch(ENDPOINT+"?action=track&no="+encodeURIComponent(no)+"&tel="+encodeURIComponent(tel)).then(function(r){return r.json();}).then(function(d){
  if(d.result!=="ok"){ err.textContent=d.message||"Sipariş bulunamadı."; err.hidden=false; return; }
  show(no,d);
 }).catch(function(){ err.textContent="Bağlantı kurulamadı. Lütfen biraz sonra tekrar deneyin."; err.hidden=false; })
 .then(function(){ btn.disabled=false; btn.textContent="Siparişimi göster"; });
});
function show(no,d){
 var h='<div class="card"><div class="ono">Sipariş numarası<b>'+esc(no)+'</b></div>';
 var cancelled=d.status==="İptal"||d.status==="İade";
 if(cancelled){ h+='<div class="cancel">Bu sipariş <b>'+esc(d.status.toLowerCase())+'</b> edilmiş. Sorunuz varsa bize WhatsApp\'tan yazabilirsiniz.</div>'; }
 else{
  var idx=0; STEPS.forEach(function(s,i){ if(s[0]===d.status) idx=i; });
  h+='<ul class="steps">'+STEPS.map(function(s,i){ var c=i<idx?"done":(i===idx?"now":"");
   var sub=(i===idx?'<small>'+esc(s[2])+(i===0&&d.date?" · "+esc(d.date):"")+'</small>':"");
   return '<li class="'+c+'"><span class="dot">'+(i<idx?"✓":"")+'</span><span>'+esc(s[1])+sub+'</span></li>'; }).join("")+'</ul>';
  if(d.trackUrl){ h+='<div class="box"><div class="k">PTT takip numarası</div><b>'+esc(d.trackingNo)+'</b></div><a class="cta" href="'+esc(d.trackUrl)+'" target="_blank" rel="noopener">Kargomu takip et</a>'; }
  else if(d.status==="Kargoya Verildi"){ h+='<div class="box">Takip numarası kısa süre içinde burada görünecek.</div>'; }
 }
 h+='<div class="box"><div class="k">Ürünler</div>'+esc(d.items)+'<div class="k" style="margin-top:8px">Toplam</div><b>'+money(d.total)+'</b> · Kapıda ödeme</div>';
 h+='<a class="wa" href="https://wa.me/908508406128?text='+encodeURIComponent("Merhaba, "+no+" numaralı siparişim hakkında bilgi almak istiyorum.")+'" rel="noopener">Siparişim hakkında yaz</a></div>';
 res.innerHTML=h; res.scrollIntoView({behavior:"smooth",block:"start"});
}
</script>
</body>
</html>
